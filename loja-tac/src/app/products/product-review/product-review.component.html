<div class="reviewSection" [class.mat-elevation-z4]="true">
    <br>
    <div class = "reviewSectionTitle">
        <span>Análises dos clientes</span>
    </div>
    <button (click) = "makeReview()" *ngIf="buttonAppear" class="makeReviewButton" color = "primary" mat-flat-button>Escreva sua análise</button>
    <div class="reviewBox">
        <div *ngIf="!buttonAppear" class="formBox">
            <div style="height: 1px;"></div>
            <div class="headerPosition">
                <div class="titlePosition">
                    <span>Por favor, nos conte o que achou do produto:</span>
                </div>

                <div class="titleGradePosition">
                    <div class="titleField">
                        <mat-form-field appearance="outline">
                            <mat-label>Título da análise</mat-label>
                            <input matInput>
                        </mat-form-field>
                    </div>

                    <div>
                        <mat-form-field class="quantityInput" appearance="outline">
                            <mat-label class="labels">Avaliação</mat-label>
                            <mat-select formControlName="quantityBought">
                                <mat-option *ngFor="let grade of grades" [value] = "grade">
                                    {{grade}}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>
                </div>

                <div class="commentFieldPosition">
                    <mat-form-field class="commentField" appearance="fill">
                        <mat-label>Comentário</mat-label>
                        <textarea placeholder="Coloque seu comentário aqui" matInput cdkTextareaAutosize></textarea>
                    </mat-form-field>
                </div>

                <div class="finishReviewButton">
                    <button color = "primary" mat-flat-button>Publicar sua análise</button>
                </div>
            </div>
        </div>
    </div>
    <div *ngFor="let review of reviews" class="reviewBox">
        <div class="dataBox">
            <div style="height: 1px;"></div>
            <div class="headerPosition">
                <div class="titlePosition">
                    <span>{{review.title}} - {{review.name}}</span>
                </div>
            </div>
            <div class="commentPosition">
                <span>
                    {{review.comment}}
                </span>
            </div>
            <div class="gradePosition">
                <span>
                    Nota: {{review.grade}} / 5
                </span>
            </div>
            <div style="height: 1px;"></div>
        </div>
    </div>

    <mat-divider></mat-divider>

</div>
<br>
